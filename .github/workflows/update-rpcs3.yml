name: Update rpcs3

on:
  workflow_dispatch:
  
concurrency:
  group: update-rpcs3
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        
      - name: Run update-rpcs3.sh
        run: nix shell nixpkgs#nix-update --command bash ./update-rpcs3.sh
        
      - name: Sanity-check evaluation
        run: nix eval .#rpcs3.version --raw
        
      - name: Verify the new source hash builds
        run: nix build .#rpcs3.src --no-link -L

      - name: Commit if changed
        run: |
          if git diff --quiet -- flake.nix; then
            echo "No changes -- rpcs3 already up to date."
            exit 0
          fi
          NEW_VERSION=$(grep -oP 'version = "\K[^"]+' flake.nix | head -n1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "rpcs3: update to ${NEW_VERSION}"
          git push
