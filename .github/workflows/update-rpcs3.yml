name: Update rpcs3

on:
  schedule:
    # Every Sunday at 04:00 UTC. Adjust as you like (min hour dom mon dow).
    - cron: "0 4 * * 0"
  # Lets you run it on demand from the Actions tab.
  workflow_dispatch:

# Don't let two runs stomp on each other.
concurrency:
  group: update-rpcs3
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # Runs your existing script verbatim, with nix-update on PATH.
      # nix-update does the real work (new rev + hash); the script then
      # repairs the version string exactly as it does locally.
      - name: Run update-rpcs3.sh
        run: nix shell nixpkgs#nix-update --command bash ./update-rpcs3.sh

      # Cheap guard: make sure the flake still evaluates before committing,
      # so a bad bump doesn't silently land on your branch.
      - name: Sanity-check evaluation
        run: nix eval .#rpcs3.version --raw

      - name: Commit if changed
        run: |
          if git diff --quiet -- flake.nix; then
            echo "No changes -- rpcs3 already up to date."
            exit 0
          fi
          NEW_VERSION=$(grep -oP 'version = "\K[^"]+' flake.nix | head -n1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "rpcs3: update to ${NEW_VERSION}"
          git push
