name: Update rpcs3 (PR)

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: update-rpcs3
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Run update-rpcs3.sh
        run: nix shell nixpkgs#nix-update --command bash ./update-rpcs3.sh

      - name: Sanity-check evaluation
        run: nix eval .#rpcs3.version --raw

      # Reads the version the script just wrote, for the PR title/body.
      - name: Read new version
        id: ver
        run: echo "version=$(grep -oP 'version = "\K[^"]+' flake.nix | head -n1)" >> "$GITHUB_OUTPUT"

      # Only creates/updates a PR if flake.nix actually changed.
      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: flake.nix
          branch: auto/rpcs3-update
          delete-branch: true
          commit-message: "rpcs3: update to ${{ steps.ver.outputs.version }}"
          title: "rpcs3: update to ${{ steps.ver.outputs.version }}"
          body: |
            Automated weekly rpcs3 bump via `update-rpcs3.sh` + `nix-update`.

            New version: `${{ steps.ver.outputs.version }}`
